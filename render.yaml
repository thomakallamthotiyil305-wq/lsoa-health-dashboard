services:
  - type: web
    name: lsoa-health-dashboard
    runtime: static
    staticPublishPath: ./site
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
