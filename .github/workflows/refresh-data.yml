name: Refresh health data

on:
  schedule:
    # Every Monday 06:00 UTC. QOF/deprivation update annually, prescribing
    # quarterly, frailty annually — weekly is frequent enough to catch a new
    # release quickly without hammering the source sites.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas numpy scipy odfpy openpyxl

      - name: Fetch latest raw data from all sources
        run: python3 scripts/fetch_raw.py

      - name: Rebuild site/data from raw sources
        run: python3 scripts/build_data.py

      - name: Commit and push if anything changed
        id: commit
        run: |
          git config user.name "lsoa-dashboard-data-bot"
          git config user.email "actions@github.com"
          git add site/data/lsoa_core.json site/data/lsoa_ind_*.json site/data/meta.json site/data/trend_*.json
          # Stage the removal of the old monolithic file this replaced (see
          # build_data.py's "remove a stale monolithic file" step); harmless
          # no-op once it's fully gone from the repo in a future run.
          git rm --cached --ignore-unmatch site/data/lsoa_data.json > /dev/null
          if git diff --cached --quiet; then
            echo "No data changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated data refresh — $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger GitHub Pages deploy
        # A push made with the default GITHUB_TOKEN deliberately does NOT
        # trigger other workflows (GitHub's anti-recursion protection), so
        # pages.yml's `on: push` would otherwise never fire from this bot's
        # commit. Dispatch it explicitly instead. Render's own GitHub-App
        # webhook isn't subject to that restriction, so it picks up the push
        # normally with no equivalent step needed here.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
            echo "### Data refreshed and pushed ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "Triggered the GitHub Pages deploy workflow explicitly; Render's own webhook picks up the push on its own." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No upstream changes found — nothing to do" >> "$GITHUB_STEP_SUMMARY"
          fi
